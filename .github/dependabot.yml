version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # Rails tracks rails/rails main and moves only through bin/bump-rails, one bump
  # per commit with a bump-log row. See docs/decisions/0001-run-on-rails-main.md.
  # Dependabot updates the revision of a branch-tracking git source, so without
  # this it would open Rails PRs that bypass that process.
  #
  # "rails" is the only name declared in the Gemfile and so the one Dependabot
  # acts on; the rest are the framework components that resolve from the same git
  # remote, listed explicitly rather than as active*/action* globs so this never
  # silently swallows an unrelated gem like activerecord-session_store.
  ignore:
  - dependency-name: "rails"
  - dependency-name: "railties"
  - dependency-name: "actioncable"
  - dependency-name: "actionmailbox"
  - dependency-name: "actionmailer"
  - dependency-name: "actionpack"
  - dependency-name: "actiontext"
  - dependency-name: "actionview"
  - dependency-name: "activejob"
  - dependency-name: "activemodel"
  - dependency-name: "activerecord"
  - dependency-name: "activestorage"
  - dependency-name: "activesupport"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
